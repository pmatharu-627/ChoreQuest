<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7657f6">
<title>ChoreQuest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast">🎉 Great job!</div>
<main class="app">
  <header class="hero">
    <button class="menu">☰</button>
    <div class="greeting">
      <div>Good morning,</div>
      <h1>Amaya!</h1>
      <div class="cheer"><span>⭐</span><div><b>You're doing amazing!</b><br>Let's make today awesome! 💖</div></div>
    </div>
    <div class="avatar"><span class="crown">👑</span>👧🏻</div>
  </header>

  <section class="balance">
    <div>
      <div class="eyebrow">Your Balance</div>
      <div class="coins"><span>🪙</span><b id="balance">165</b><small>coins</small></div>
      <div class="streak">🔥 4 day streak</div>
    </div>
    <div class="pig">🐷<span class="coin-float">🪙</span></div>
  </section>

  <section class="reward">
    <div class="reward-head"><div><span>Next Reward</span><h2>Movie Night</h2></div><b><span id="progressNum">165</span>/200</b></div>
    <div class="movie">🍿 🎬</div>
    <div class="bar"><div id="progressBar"></div></div>
    <p>You're so close! Just <b id="remaining">35</b> more coins! 🤩</p>
  </section>

  <section class="chores">
    <div class="section-title"><h2>Today's chores ✨</h2><button id="addChore">+ Add chore</button></div>
    <div id="choreList"></div>
  </section>
</main>

<nav>
  <button class="active">🏠<span>Home</span></button>
  <button>📋<span>Chores</span></button>
  <button>🎁<span>Rewards</span></button>
  <button>🛒<span>Shop</span></button>
  <button>👤<span>Profile</span></button>
</nav>
<script src="app.js"></script>
</body>
</html>
